<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokLite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">TokLite</div>
  <button id="accountBtn">Create account</button>
</header>

<main>
  <section id="auth" class="card">
    <h2 id="authTitle">Create your account</h2>
    <input id="username" placeholder="Username" maxlength="20">
    <input id="password" type="password" placeholder="Password">
    <button id="authAction">Create account</button>
    <p id="authMsg"></p>
    <button class="linkBtn" id="switchAuth">Already have an account? Log in</button>
  </section>

  <section id="app" hidden>
    <div class="tabs">
      <button class="tab active" data-tab="feed">For You</button>
      <button class="tab" data-tab="post">＋ Post</button>
      <button class="tab" data-tab="profile">Profile</button>
    </div>

    <section id="feed" class="view"></section>

    <section id="post" class="view" hidden>
      <div class="card">
        <h2>Make a post</h2>
        <input id="caption" placeholder="Write a caption..." maxlength="120">
        <input id="videoFile" type="file" accept="video/*">
        <button id="postBtn">Post video</button>
        <p id="postMsg"></p>
      </div>
    </section>

    <section id="profile" class="view" hidden>
      <div class="card">
        <h2 id="profileName"></h2>
        <p id="postCount"></p>
        <button id="logout">Log out</button>
      </div>
    </section>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
